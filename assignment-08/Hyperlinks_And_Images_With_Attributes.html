<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks_And_Images_With_Attributes</title>
</head>
<body>
    <!-- External link: opens another website in a new tab -->
     <a href="https://www.example.com"
     target="_blank"
     rel="noopener noreferrer"
     title="external link">
    external link
  </a>

  <br><br>

  <!-- Internal link: jumps to a section on this page -->
  <a href="#go to bottom" title="Go to the bottom section">
    Go to Bottom
  </a>

  <br><br>

  <!-- Email link: opens the visitor's email app -->
  <a href="mailto:hello@example.com"
     title="Send us an email">
    Email us
  </a>

  <br><br>

  <!-- Image link: clicking the image opens another page -->
  <a href="https://www.example.com"
     target="_blank"
     rel="noopener noreferrer"
     title="Open Example">
    <img src="example.jpg"
         alt="Example image"
         width="200">
  </a>

  <section id="Bottom">
    <h2>Bottom</h2> <a href="#back to top" title="back to the top section">
    back to Top
  </a>
  </section>
    
</body>
</html>
